version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres_db_ressource
    restart: always
    environment:
      POSTGRES_USER: admin           
      POSTGRES_PASSWORD: password123 
      POSTGRES_DB: ressource_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: